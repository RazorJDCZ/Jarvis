[package]
name = "jarvis-desktop"
version = "1.0.0"
description = "Aplicación de escritorio privada para Jarvis"
authors = ["Jarvis"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
