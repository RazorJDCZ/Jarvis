[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.5.0"
description = "A private, local-first voice assistant for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.2.1,<2",
  "kokoro-onnx>=0.4.4,<0.5",
  "piper-tts>=1.5,<2",
  "soundfile>=0.13,<1",
]
actions = [
  "pillow>=11,<13",
  "playwright>=1.61,<2",
  "pycaw>=20251023,<20260000",
  "pyperclip>=1.11,<2",
  "pywinauto>=0.6.9,<1",
]
dev = [
  "httpx2>=2.7,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
jarvis = "jarvis.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
